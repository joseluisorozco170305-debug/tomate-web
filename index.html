    <style>
      html{background:#291C0E}body{margin:0}
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,#4a3020 0%,#291C0E 70%);transition:opacity .6s ease,visibility .6s}
      #splash.fuera{opacity:0;visibility:hidden}
      #splash .s-logo{width:84px;height:84px;animation:s-late 1.1s cubic-bezier(.5,0,.3,1) infinite}
      #splash .s-barra{margin-top:22px;width:120px;height:3px;border-radius:9px;background:rgba(225,212,194,.14);overflow:hidden}
      #splash .s-barra i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#A78D78,#E1D4C2);animation:s-carga 1.2s ease-in-out infinite}
      @keyframes s-late{0%,100%{transform:scale(1)}40%{transform:scale(1.08)}60%{transform:scale(.97)}}
      @keyframes s-carga{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
      @media (prefers-reduced-motion:reduce){#splash .s-logo,#splash .s-barra i{animation:none}}
